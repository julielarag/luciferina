<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131a">
    <title>Red de partículas — Luciferina</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/script.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="intro">
          <h1>
            <a class="home-link" href="index.html">
              <span>Redes inteligentes detrás</span>
              <span>de la bioluminiscencia</span>
            </a>
          </h1>
        </div>
        <nav class="species-filters" id="species-filters" aria-label="Filtrar por especie"></nav>
      </header>

      <section class="visualization" aria-label="Visualización de keywords">
        <div class="stage" id="particle-stage">
          <img
            class="inactive-artwork"
            src="img/particulas_inactivas.png"
            alt=""
            aria-hidden="true"
          >
          <div class="particle-layer" id="particle-layer"></div>
        </div>
      </section>

      <p class="app-status" id="app-status" role="status">Cargando datos y partículas…</p>

      <aside class="definition-panel" id="definition-panel" aria-live="polite" hidden>
        <h2 id="definition-title"></h2>
        <p class="definition-text" id="definition-text"></p>
      </aside>
    </main>
  </body>
</html>
